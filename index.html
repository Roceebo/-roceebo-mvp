<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roceebo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #171717;
    }

    .app {
      max-width: 520px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      padding: 24px 20px 18px;
      background: #111827;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 5px 0 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    .section {
      padding: 20px;
    }

    h2 {
      margin: 0 0 15px;
      font-size: 19px;
    }

    .transaction {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
      cursor: pointer;
      background: white;
    }

    .transaction.selected {
      border: 2px solid #0f766e;
      background: #f0fdfa;
    }

    .transaction-top {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 16px;
    }

    .transaction-info {
      margin-top: 6px;
      color: #666;
      font-size: 13px;
    }

    .editor {
      display: none;
      border-top: 8px solid #f4f5f7;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin: 14px 0 6px;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 80px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #0f766e;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .receipt-area {
      display: none;
      padding: 25px 20px 40px;
      background: #e5e7eb;
    }

    .receipt {
      background: white;
      width: 100%;
      max-width: 330px;
      margin: auto;
      padding: 30px 24px;
      font-family: "Courier New", monospace;
      box-shadow: 0 3px 14px rgba(0,0,0,.12);
    }

    .receipt h3 {
      text-align: center;
      font-size: 20px;
      margin: 0 0 5px;
    }

    .receipt .location {
      text-align: center;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .line {
      border-top: 1px dashed #555;
      margin: 15px 0;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      margin: 9px 0;
      font-size: 14px;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
    }

    .purpose {
      font-size: 12px;
      margin-top: 18px;
    }

    .verified {
      margin-top: 25px;
      text-align: center;
      font-size: 9px;
      color: #777;
    }

    .back {
      background: #374151;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>Roceebo</h1>
    <p>Turn transactions into expense records.</p>
  </header>

  <div class="section" id="transactions">

    <h2>Recent Transactions</h2>

    <div class="transaction" onclick="selectTransaction(
      'Brazen Head Pub',
      '20.00',
      '08/20/2026',
      'West Bend',
      'WI',
      '1114'
    )">

      <div class="transaction-top">
        <span>Brazen Head Pub</span>
        <span>$20.00</span>
      </div>

      <div class="transaction-info">
        Aug 20, 2026 • West Bend, WI
      </div>

    </div>

    <div class="transaction" onclick="selectTransaction(
      'Airport Parking',
      '42.00',
      '08/19/2026',
      'Milwaukee',
      'WI',
      '1114'
    )">

      <div class="transaction-top">
        <span>Airport Parking</span>
        <span>$42.00</span>
      </div>

      <div class="transaction-info">
        Aug 19, 2026 • Milwaukee, WI
      </div>

    </div>

  </div>


  <div class="section editor" id="editor">

    <h2>Review Transaction</h2>

    <label>Merchant</label>
    <input id="merchant">

    <label>Amount</label>
    <input id="amount">

    <label>Date</label>
    <input id="date">

    <label>City</label>
    <input id="city">

    <label>State</label>
    <input id="state">

    <label>Card Last 4</label>
    <input id="card">

    <label>Business Purpose</label>
    <textarea
      id="purpose"
      placeholder="Example: Drinks after distributor buyer event"
    ></textarea>

    <button onclick="generateReceipt()">
      Generate Receipt
    </button>

  </div>


  <div class="receipt-area" id="receiptArea">

    <div class="receipt">

      <h3 id="rMerchant"></h3>

      <div class="location" id="rLocation"></div>

      <div class="line"></div>

      <div class="receipt-row">
        <span>DATE</span>
        <span id="rDate"></span>
      </div>

      <div class="receipt-row">
        <span>CARD</span>
        <span id="rCard"></span>
      </div>

      <div class="line"></div>

      <div class="receipt-row total">
        <span>TOTAL</span>
        <span id="rAmount"></span>
      </div>

      <div class="line"></div>

      <div class="purpose" id="rPurpose"></div>

      <div class="verified">
        Transaction record prepared from verified transaction data
      </div>

    </div>

    <button class="back" onclick="backToEditor()">
      Edit Receipt
    </button>

  </div>

</div>


<script>

function selectTransaction(merchant, amount, date, city, state, card) {

  document.getElementById("merchant").value = merchant;
  document.getElementById("amount").value = amount;
  document.getElementById("date").value = date;
  document.getElementById("city").value = city;
  document.getElementById("state").value = state;
  document.getElementById("card").value = card;

  document.getElementById("editor").style.display = "block";

  document.getElementById("editor").scrollIntoView({
    behavior: "smooth"
  });
}


function generateReceipt() {

  const merchant =
    document.getElementById("merchant").value;

  const amount =
    document.getElementById("amount").value;

  const date =
    document.getElementById("date").value;

  const city =
    document.getElementById("city").value;

  const state =
    document.getElementById("state").value;

  const card =
    document.getElementById("card").value;

  const purpose =
    document.getElementById("purpose").value;


  document.getElementById("rMerchant").textContent =
    merchant.toUpperCase();

  document.getElementById("rAmount").textContent =
    "$" + Number(amount).toFixed(2);

  document.getElementById("rDate").textContent =
    date;

  document.getElementById("rLocation").textContent =
    city + ", " + state;

  document.getElementById("rCard").textContent =
    "VISA ****" + card;


  if (purpose.trim()) {

    document.getElementById("rPurpose").innerHTML =
      "<strong>BUSINESS PURPOSE</strong><br>" + purpose;

  } else {

    document.getElementById("rPurpose").innerHTML = "";

  }


  document.getElementById("transactions").style.display =
    "none";

  document.getElementById("editor").style.display =
    "none";

  document.getElementById("receiptArea").style.display =
    "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


function backToEditor() {

  document.getElementById("receiptArea").style.display =
    "none";

  document.getElementById("transactions").style.display =
    "block";

  document.getElementById("editor").style.display =
    "block";
}

</script>

</body>
</html>
